name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix firebase/functions
      - run: npm test --prefix firebase/functions
      - run: ./firebase/functions/node_modules/.bin/firebase emulators:exec --project demo-alnasser --only firestore,auth,functions "npm run test:integration --prefix firebase/functions"
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if ! curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"; then
            echo '::error::Unable to download Android SDK tools from Google'; exit 1
          fi
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and test APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain -Dorg.gradle.jvmargs=-Xmx768m 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            echo "::error::Gradle or tee failed with status $?"
            grep -E "(^e:| error:|^\* What went wrong:|^Execution failed for task|^Caused by:|^> [^T])" "$RUNNER_TEMP/gradle.log" | head -50 | while IFS= read -r line; do echo "::error::$line"; done
            tail -70 "$RUNNER_TEMP/gradle.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: al-nasser-preview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  android-instrumentation:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Room on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest
